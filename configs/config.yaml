# `_self_` FIRST, not last. This file carries full `augment:` and `window:` blocks so every key has
# a documented default in one readable place, and the `setting` group has to win over them; with
# `_self_` last, `setting=var` silently resolved back to `base`'s values.
defaults:
  - _self_
  - data: p2pdata
  - trainer: default
  - setting: base
  # `backbone=scratch` swaps ACE-Step for a DiT trained from random initialisation; see below.
  - backbone: acestep

exp_name: p2pa_v1
seed: 42
runs_dir: runs
tensorboard_dir: tensorboards

# The backbone's own numbers, cross-checked against the checkpoint's config.json at load time.
# They are declared here rather than only read, so a config that disagrees with the weights fails
# immediately instead of producing a shape error deep in a training step.
ace:
  model_name: ACE-Step/acestep-v15-base
  # The VAE and the frozen text encoder ship in the main ACE-Step repo, not the DiT's.
  assets_repo: ACE-Step/Ace-Step1.5
  vae_subfolder: vae
  text_encoder_subfolder: Qwen3-Embedding-0.6B
  sample_rate: 48000
  audio_channels: 2
  latent_channels: 64
  # 48000 / 1920 = exactly 25 latent frames per second. No measurement caveat here, unlike SAME.
  hop_length: 1920
  # src_latents(64) + chunk_masks(64) + x_t(64). This is what makes the conditioning slot exist.
  in_channels: 192
  # `proj_in` is a stride-2 Conv1d, so a window is always a whole number of patches.
  patch_size: 2
  prompt_dim: 1024
  # ACE-Step tokenizes the DiT prompt at 256. Every cached prompt is padded to exactly this,
  # because the DiT discards the cross-attention mask and so attends to padding either way —
  # a fixed length at least makes what it attends to a property of the track, not of its batch.
  prompt_max_length: 256
  cfg_ratio: 0.15
  refer_frames: 750
  # Chunked VAE encode. A whole 4-minute track in one pass peaks at 36.5 GB of VRAM (measured on
  # this corpus), which is not a thing to ask of a shared machine. 512 frames is 20.5 s and peaks
  # around 3 GB; the 32-frame overlap is discarded on both sides, so every kept frame is built
  # from a full receptive field.
  chunk_frames: 512
  chunk_overlap_frames: 32

roll:
  pitch_low: 21
  pitch_high: 108
  # One roll frame per latent frame: the conv encoder has no strided stem, so the roll arrives at
  # the latent rate. `frames_per_second` must equal oversample x 48000/1920 exactly;
  # validate_config enforces it, because any other rate misaligns the condition with its audio.
  oversample: 1
  frames_per_second: 25.0
  # Onset planes carry velocity; sustain planes are binary presence.
  velocity_in_onset: true

# The condition encoder: dilation-free residual 1-D convolutions, zero-initialised at the output
# and biased at the checkpoint's silence latent, so an untrained encoder is stock ACE-Step.
model:
  cond_dim: 512
  # Counts the stem: 5 is one stem plus four residual blocks.
  cond_layers: 5
  # Odd, so each convolution stays centred on its frame.
  cond_kernel: 5
  inference_steps: 30
  guidance: 7.0
  # ACE-Step's timestep shift at inference. 1.0 is the base model's own default.
  shift: 1.0

# A full finetune of all 2.39B DiT weights. The backbone is frozen for the first `freeze_steps`
# while only the zero-initialised roll encoder trains, then unfrozen in place.
finetune:
  freeze_steps: 2000
  # A full checkpoint is 27 GB, most of it AdamW moments; keep one monitored copy plus last.ckpt.
  save_top_k: 1
  lr_backbone: 1.0e-5
  lr_cond: 1.0e-4

# `backbone=scratch` only: `p2p`'s rectified-flow DiT, about 220M parameters, trained from random
# initialisation. No freeze window, one learning rate for both groups, and an EMA of the weights
# that validation and sampling use.
scratch:
  hidden_dim: 768
  num_heads: 12
  mmdit_blocks: 0
  dit_blocks: 8
  mlp_ratio: 4.0
  # Classifier-free-guidance dropout of the roll (the finetune never drops it).
  cond_dropout: 0.1
  logit_normal: true
  lr: 1.0e-4
  ema_decay: 0.999
  save_top_k: 3

# Window length: the ceiling holds at `min_seconds` for `hold_steps`, then rises by `ramp_seconds`
# every `ramp_every_steps` until `max_seconds`. The floor stays put, so the range widens rather
# than slides. Validation is always at `max_seconds`.
length:
  min_seconds: 20.0
  max_seconds: 30.0
  ramp_seconds: 5.0
  ramp_every_steps: 10000
  hold_steps: 100000

prep:
  shard: 0
  num_shards: 1
  reindex: false
  encode_device: cuda
  # GM program 0 only, matching the hard mask the corpus builder decoded under. The vocal melody
  # is written at GM 52 and is rasterised outside this filter.
  programs: [0]
  retry_rejected: false
  # Every cap is set above this corpus's own measured maximum — notes/second reaches 21.3,
  # simultaneous notes 58, the longest note 22.4 s, duration_ratio bottoms out at 0.65. The stage
  # exists to catch a decode that exploded, not to trim the busiest 3% of a healthy corpus.
  # `prep.stages=[screen] prep.report_outliers=true` re-prints the distribution.
  reject_outliers: true
  max_notes_per_second: 40.0
  max_simultaneous_notes: 64
  max_note_seconds: 45.0
  max_duration_ratio_error: 0.4
  # The target side, and the one that actually predicts an MSE spike: these latents measure
  # std 0.80-1.09 corpus-wide, so anything past this is a bad encode rather than loud music.
  max_latent_abs: 25.0
  outlier_mad_z: 12.0
  blocklist: []
  # Which stages `p2pa-prep` runs, in order. Named rather than positional so a re-run can do just
  # one: `prep.stages=[screen]` re-applies the outlier thresholds without touching a latent.
  stages: [index, screen, encode, notes, dataset]
  report_outliers: false

# Conditioning augmentation, drawn per `window.segment_bars`-bar segment when
# `window.segment_augment` is on. Set by the `setting` group, never by hand.
#
# Source: the original transcription with `baseline_probability`, PiCoGen with
# `picogen_probability`, and the remainder split evenly over the track's MuScriptor variants.
# Style: one of `normal` / `chord_thin` / `octave_move` / `octave_shift`, by these weights.
augment:
  baseline_probability: 0.0
  picogen_probability: 0.0
  normal: 1.0
  chord_thin: 0.0
  octave_move: 0.0
  octave_shift: 0.0
  chord_tone_rate: [0.05, 0.2]
  tension_rate: [0.2, 0.6]
  octave_move_rate: [0.1, 0.5]
  octave_shift_choices: [-12, 0, 12]

window:
  segment_bars: 4
  segment_augment: false
  segment_max_simultaneous_notes: 25
  draw_attempts: 8
  # Each song contributes this many independently drawn windows to one pass over the corpus. This
  # only decides how often validation and sampling come round; the run ends at trainer.max_steps.
  segments_per_song: 10

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
