# resolved_config.yaml of scratch_conv_pico (500k steps; not in the paper), as it recorded it.
# `data.soundfont` removed and `trainer.devices` normalised: both are properties of the machine.
exp_name: scratch_conv_pico
seed: 42
runs_dir: runs
tensorboard_dir: tensorboards
data:
  manifest_dir: .cache/manifests
  latent_dir: .cache/latents
  prompt_dir: .cache/prompt
  caption_dir: .cache/captions
  notes_dir: .cache/notes
  clap_dir: .cache/clap
  covers_root: covers
  min_notes: 24
  train_fraction: 0.95
  validation_fraction: 0.03
  batch_size: 16
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  persistent_workers: false
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  fluidsynth: fluidsynth
  source:
    name: p2pdata
    audio_revision: pop2piano_separated_v1
    root: data/p2pdata
    audio_subdir: audio
    instrumental_name: instrumental.mp3
    midi_subdir: midi
    baseline_midi: full-piano.mid
    picogen_midi: full-picogen.mid
    beats_subdir: beats
    vocal_subdir: vocal_melody
    excluded_variant_programs:
    - organ
    - strings
ace:
  model_name: ACE-Step/acestep-v15-base
  assets_repo: ACE-Step/Ace-Step1.5
  vae_subfolder: vae
  text_encoder_subfolder: Qwen3-Embedding-0.6B
  sample_rate: 48000
  audio_channels: 2
  latent_channels: 64
  hop_length: 1920
  in_channels: 192
  patch_size: 2
  prompt_dim: 1024
  prompt_max_length: 256
  cfg_ratio: 0.15
  refer_frames: 750
  chunk_frames: 512
  chunk_overlap_frames: 32
roll:
  pitch_low: 21
  pitch_high: 108
  oversample: 1
  frames_per_second: 25.0
  velocity_in_onset: true
  registers:
  - 48
  - 72
  dynamics_channel: true
  dynamics_normalise: true
  dynamics_scope: track
  vocal_melody: false
  vocal_dropout: 0.0
prep:
  shard: 0
  num_shards: 1
  reindex: false
  encode_device: cuda
  programs:
  - 0
  retry_rejected: false
  stages:
  - index
  - screen
  - adopt
  - encode
  - notes
  - clap
  - dataset
  report_outliers: false
  adopt_latents_from: ''
  adopt_manifest: ''
  adopt_clap_from: ''
  reject_outliers: true
  max_notes_per_second: 40.0
  max_simultaneous_notes: 64
  max_note_seconds: 45.0
  max_duration_ratio_error: 0.4
  max_latent_abs: 25.0
  outlier_mad_z: 12.0
  blocklist: []
model:
  cond_source: roll
  cond_encoder: conv
  cond_dim: 512
  cond_layers: 5
  cond_kernel: 5
  cond_heads: 8
  cond_mlp_ratio: 4.0
  cond_dropout: 0.1
  cond_injection: concat
  text_source: zero
  hidden_dim: 768
  num_heads: 12
  mmdit_blocks: 0
  dit_blocks: 8
  mlp_ratio: 4.0
  clap_source: zero
  clap_dim: 512
  clap_dropout: 0.1
  logit_normal: true
  inference_steps: 50
  guidance: 2.0
  shift: 1.0
phase:
  name: scratch
  freeze_steps: 0
  backbone_dtype: float32
  ema_enabled: true
  save_top_k: 3
  lr_backbone: 0.0001
  lr_cond: 0.0001
  lora:
    enabled: false
    rank: 64
    alpha: 64
    dropout: 0.0
    target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
    target_prefix: decoder.layers.
augment:
  enabled: true
  normal: 1.0
  chord_thin: 0.0
  octave_move: 0.0
  octave_shift: 0.0
  random: 0.0
  pianistic: 0.0
  polyfold: 0.0
  chord_tone_rate:
  - 0.05
  - 0.2
  tension_rate:
  - 0.2
  - 0.6
  octave_move_rate:
  - 0.1
  - 0.5
  octave_shift_choices:
  - -12
  - 0
  - 12
  random_rate:
  - 0.1
  - 0.5
  pianistic_fraction:
  - 0.2
  - 0.6
  polyfold_cap:
  - 3
  - 6
  polyfold_fold_rate: 0.5
  variant_probability: 0.0
  baseline_probability: 0.0
  picogen_probability: 1.0
length:
  mode: curriculum
  min_seconds: 20.0
  max_seconds: 30.0
  ramp_seconds: 5.0
  ramp_every_steps: 10000
  hold_steps: 100000
window:
  segment_bars: 4
  segment_augment: true
  segment_max_simultaneous_notes: 25
  draw_attempts: 8
  segments_per_song: 10
trainer:
  max_steps: 500000
  weight_decay: 0.01
  grad_clip: 1.0
  warmup_steps: 500
  ema_decay: 0.999
  ema_enabled: ${phase.ema_enabled}
  precision: bf16-mixed
  accelerator: auto
  devices:
  - 0
  gradient_checkpointing: true
  log_every_n_steps: 20
  auto_resume: true
  val_check_interval: 2000
  limit_val_batches: 40
  val_timesteps: 5
  sample_items: 2
  kong_sample_items: 2
  kong_sample_ids:
  - 0TMG60NMShM
  - 00wvcg5SmFs
  kong_sample_bpms:
  - 63.8
  - 130.4
  sample_every_n_steps: 10000
  sample_ids: []
  mp3_bitrate_kbps: 192
  accumulate_grad_batches: 1
  dry_run_steps: 0
  rss_limit_gb: 64.0
  loss_spike_factor: 8.0
  loss_spike_warmup: 200
